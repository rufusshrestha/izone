<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try { const t = localStorage.getItem("izone-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<title>iZone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M16 7v18M8.2 11.5l15.6 9M8.2 20.5l15.6-9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f1f4f9; --surface-3: #e8edf5;
  --text: #0f172a; --muted: #64748b; --faint: #94a3b8; --border: #e3e8f0;
  --accent: #2563eb; --accent-soft: #e6eefe; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  --cool: #2f7cf6; --heat: #f2711c; --vent: #0fa89b; --dry: #d4a20b; --auto: #8155f2;
  --open: #d97706; --closed: #94a3b8; --climate: #16a34a;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
  --shadow-lg: 0 20px 60px rgba(15,23,42,.18);
  --radius: 18px; --radius-sm: 12px;
}
/* Theme: follows the system unless data-theme="light"/"dark" is set by the theme button */
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0f1c; --surface: #111827; --surface-2: #172033; --surface-3: #1f2a40;
    --text: #e8edf6; --muted: #93a0b8; --faint: #64748b; --border: #222e45;
    --accent: #5b8cff; --accent-soft: #1b2a4d; --closed: #64748b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --shadow-lg: 0 20px 60px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0f1c; --surface: #111827; --surface-2: #172033; --surface-3: #1f2a40;
    --text: #e8edf6; --muted: #93a0b8; --faint: #64748b; --border: #222e45;
    --accent: #5b8cff; --accent-soft: #1b2a4d; --closed: #64748b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --shadow-lg: 0 20px 60px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: hidden; }
body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 18px; height: 18px; flex: none; }

/* ---------- Layout ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #6d5cf6); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,.35); }
.brand-mark svg { width: 18px; height: 18px; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-left: 12px; }
.tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 9px; color: var(--muted); font-weight: 550; display: flex; align-items: center; gap: 7px; }
.tab svg { width: 16px; height: 16px; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.conn { display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
.icon-btn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
.view[hidden] { display: none; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 2px 14px; }
.section-head h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.section-head .sub { color: var(--muted); font-size: 13px; }
.progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); z-index: 50; width: 0; opacity: 0; transition: width .3s ease, opacity .3s; }
.progress.on { width: 70%; opacity: 1; transition: width 4s cubic-bezier(.1,.6,.2,1); }

/* ---------- Cards & controls ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; color: var(--muted); font-weight: 560; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: background .15s, color .15s; }
.seg button:hover:not(:disabled):not([aria-pressed="true"]) { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--c, var(--text)); box-shadow: var(--shadow); }
.seg.small button { padding: 6px 10px; font-size: 13px; }
.seg.full { display: flex; flex-wrap: nowrap; } .seg.full button { flex: 1 1 0; min-width: 0; justify-content: center; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 9px 16px; border-radius: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.chip svg { width: 14px; height: 14px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.stepper button { width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 20px; line-height: 1; color: var(--text); }
.stepper button:hover:not(:disabled) { background: var(--surface-3); }
.stepper .val { min-width: 84px; text-align: center; font-weight: 650; font-size: 18px; font-variant-numeric: tabular-nums; }
.stepper.small button { width: 30px; height: 30px; font-size: 17px; border-radius: 8px; }
.stepper.small .val { min-width: 64px; font-size: 15px; }
.stepper.pending .val { color: var(--accent); }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--surface-3); border-radius: 999px; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + span { opacity: .5; }
input[type=text], input[type=password], input[type=number], input[type=time], select {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; outline: none; min-width: 0;
}
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 560; }

/* ---------- Climate hero ---------- */
.hero { display: grid; grid-template-columns: 220px 1fr 1.25fr; gap: 0; overflow: hidden; }
.hero > div { padding: 26px 28px; min-width: 0; }
.hero > div + div { border-left: 1px solid var(--border); }
.power { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.power-btn {
  width: 104px; height: 104px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--surface-2); color: var(--faint); box-shadow: inset 0 0 0 1px var(--border);
  transition: background .25s, color .25s, box-shadow .25s, transform .1s;
}
.power-btn svg { width: 38px; height: 38px; stroke-width: 2.2; }
.power-btn:active { transform: scale(.97); }
.power-btn.on { background: var(--mode-c, var(--accent)); color: #fff; box-shadow: 0 10px 30px color-mix(in srgb, var(--mode-c, var(--accent)) 45%, transparent); }
.power-label { font-weight: 650; }
.power-label small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.temps { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.temp-big { font-size: 64px; font-weight: 300; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.temp-big sup { font-size: 26px; font-weight: 400; vertical-align: top; position: relative; top: 8px; margin-left: 2px; color: var(--muted); }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
.target-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.follow-note { color: var(--muted); font-size: 13.5px; }
.follow-note b { color: var(--text); font-weight: 650; }
.controls { display: grid; gap: 18px; align-content: center; }
.controls .row { display: grid; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; margin-bottom: 16px; font-weight: 550; }
.banner.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.banner .btn { margin-left: auto; }

/* ---------- Zones ---------- */
.zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }
.zone { padding: 18px; display: flex; flex-direction: column; gap: 14px; transition: border-color .2s, box-shadow .2s; position: relative; min-width: 0; }
.zone.active { border-color: color-mix(in srgb, var(--zc) 45%, var(--border)); }
.zone-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.zone-name { font-weight: 650; font-size: 15.5px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.zone-name span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idx { font-size: 11.5px; font-weight: 650; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.zone-state { font-size: 12.5px; font-weight: 650; color: var(--zc); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.zone-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--zc); }
.zone-mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.zone-temp { font-size: 38px; font-weight: 300; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.zone-temp sup { font-size: 16px; color: var(--muted); vertical-align: top; position: relative; top: 4px; }
.zone-temp.none { color: var(--faint); font-size: 30px; }
.zone .alerts { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Schedules ---------- */
.sched-list { display: grid; gap: 12px; }
.sched { display: grid; grid-template-columns: auto 1.3fr 1fr 1.4fr auto; align-items: center; gap: 18px; padding: 16px 20px; }
.sched.empty { opacity: .72; }
.sched-name { font-weight: 650; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sched-name .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sched-name .unnamed { color: var(--faint); font-weight: 500; font-style: italic; }
.sched-sub { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.times { font-variant-numeric: tabular-nums; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.times .na { color: var(--faint); font-weight: 500; }
.times svg { color: var(--faint); width: 15px; height: 15px; }
.days { display: flex; gap: 5px; }
.day { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 650; background: var(--surface-2); color: var(--faint); }
.day.on { background: var(--accent-soft); color: var(--accent); }
.sched-actions { display: flex; gap: 6px; }

/* ---------- Settings ---------- */
.settings { display: grid; gap: 18px; }
.set-section h3 { margin: 0; padding: 18px 22px 6px; font-size: 15px; }
.set-row { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-top: 1px solid var(--border); }
.set-section h3 + .set-row { border-top: 0; }
.set-row .lbl { flex: 1; min-width: 0; }
.set-row .lbl b { font-weight: 600; display: block; }
.set-row .lbl small { color: var(--muted); font-size: 13px; }
.set-ctl { display: flex; align-items: center; gap: 8px; }
.set-ctl input[type=number] { width: 104px; text-align: right; }
.unit { color: var(--muted); font-size: 13px; min-width: 26px; }

/* ---------- Modal ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(8,12,24,.45); backdrop-filter: blur(3px); z-index: 40; display: grid; place-items: center; padding: 20px; animation: fade .15s ease; }
.modal { width: min(640px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); animation: pop .18s ease; }
.modal.narrow { width: min(420px, 100%); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 20px 24px 6px; }
.modal-head h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 14px 24px 8px; display: grid; gap: 18px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px 22px; }
.modal-foot .left { margin-right: auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.time-field { display: flex; align-items: center; gap: 10px; }
.time-field input[type=time] { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.day-picker { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.day-picker .day { width: 40px; height: 40px; border: 0; font-size: 13px; }
.presets { display: flex; gap: 6px; margin-left: auto; }
.zone-table { display: grid; gap: 8px; }
.zone-table .zr { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--surface-2); border-radius: 12px; }
.zone-table .zr .zn { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.zone-table select { padding: 6px 8px; }
.zone-table input[type=number] { width: 84px; padding: 6px 8px; text-align: right; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kv div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.kv small { display: block; color: var(--muted); font-size: 12px; }
.kv b { font-weight: 650; }
.range-row { display: grid; grid-template-columns: 90px 1fr 56px; gap: 12px; align-items: center; }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- Toasts & misc ---------- */
.toasts { position: fixed; bottom: 22px; right: 22px; display: grid; gap: 10px; z-index: 60; max-width: min(420px, calc(100vw - 44px)); }
.toast { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); border-radius: 14px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; animation: pop .2s ease; font-size: 14px; }
.toast svg { margin-top: 1px; }
.toast.ok svg { color: var(--ok); } .toast.bad svg { color: var(--bad); }
.toast.bad { border-color: color-mix(in srgb, var(--bad) 35%, var(--border)); }
.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius); }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
.muted { color: var(--muted); }
.mode-cool { --c: var(--cool); } .mode-heat { --c: var(--heat); } .mode-vent { --c: var(--vent); } .mode-dry { --c: var(--dry); } .mode-auto { --c: var(--auto); }

/* ---------- Sign-in ---------- */
.auth-wrap { min-height: calc(100vh - 140px); display: grid; place-items: center; padding: 20px 0; }
.auth-card { width: min(400px, 100%); padding: 34px 32px 30px; display: grid; gap: 18px; }
.auth-card .brand-mark { width: 48px; height: 48px; border-radius: 14px; }
.auth-card .brand-mark svg { width: 26px; height: 26px; }
.auth-card h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.auth-card p { margin: -8px 0 0; color: var(--muted); }
.auth-card input { width: 100%; padding: 11px 13px; font-size: 15px; }
.auth-card .btn { justify-content: center; padding: 11px 16px; }
.form-error { color: var(--bad); font-size: 13.5px; font-weight: 550; display: flex; gap: 8px; align-items: flex-start; }
.form-error:empty { display: none; }
.hint { color: var(--muted); font-size: 12.5px; }
.account { display: flex; gap: 8px; }
body.signed-out .tabs, body.signed-out .account, body.signed-out #refresh { display: none; }

@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr 1fr; }
  .hero > .controls { grid-column: 1 / -1; border-left: 0 !important; border-top: 1px solid var(--border); }
  .sched { grid-template-columns: auto 1fr auto; }
  .sched .times, .sched .days { grid-column: 2 / 4; }
}
@media (max-width: 640px) {
  .topbar-inner { flex-wrap: wrap; padding: 12px 16px; gap: 12px; }
  .tabs { order: 3; width: 100%; margin-left: 0; } .tab { flex: 1; justify-content: center; }
  main { padding: 20px 14px 60px; }
  #conn-text { display: none; }
  .seg.full button { padding: 8px 4px; font-size: 13px; }
  .seg.full button svg { display: none; }
  .hero > div { padding: 22px 18px; }
  .banner { flex-wrap: wrap; }
  .hero { grid-template-columns: 1fr; }
  .hero > div + div { border-left: 0; border-top: 1px solid var(--border); }
  .temp-big { font-size: 54px; }
  .grid2 { grid-template-columns: 1fr; }
  .sched { grid-template-columns: auto 1fr; } .sched .times, .sched .days, .sched-actions { grid-column: 1 / -1; }
  .set-row { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-mark" data-icon="snow"></div>iZone</div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="climate" aria-selected="true"><i data-icon="home"></i>Climate</button>
      <button class="tab" role="tab" data-tab="schedules" aria-selected="false"><i data-icon="calendar"></i>Schedules</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false"><i data-icon="gear"></i>Settings</button>
    </nav>
    <div class="topbar-right">
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></div>
      <button class="icon-btn" id="theme" aria-label="Theme"></button>
      <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh"><i data-icon="refresh"></i></button>
      <div id="account" class="account">
        <button class="icon-btn" data-action="change-password" aria-label="Change password" title="Change password"><i data-icon="key"></i></button>
        <button class="icon-btn" data-action="sign-out" aria-label="Sign out" title="Sign out"><i data-icon="logout"></i></button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="view" id="view-auth" hidden></section>
  <section class="view" id="view-climate" hidden></section>
  <section class="view" id="view-schedules" hidden></section>
  <section class="view" id="view-settings" hidden></section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   Icons (inline SVG, stroke-based)
   ============================================================ */
const ICONS = {
  snow: '<path d="M12 2v20M4.2 6.5l15.6 9M4.2 15.5l15.6-9M9 3.5l3 2 3-2M9 20.5l3-2 3 2"/>',
  flame: '<path d="M12 22c4 0 7-2.8 7-7 0-3.5-2.2-6-4-8 0 2.5-1.5 4-3 4 .5-3-1-6-4-9 0 4-5 6.5-5 13 0 4.2 4 7 9 7z"/>',
  fan: '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2.5 0 3 3 1 5l-3 2.5M14 12c4 0 7 1 7 4 0 2.5-3 3-5 1l-2.5-3M12 14c0 4-1 7-4 7-2.5 0-3-3-1-5l3-2.5M10 12c-4 0-7-1-7-4 0-2.5 3-3 5-1l2.5 3"/>',
  drop: '<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/>',
  auto: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>',
  power: '<path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/>',
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  thermo: '<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  wind: '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/>',
  filter: '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/>',
  lock: '<rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
};
function icon(name, cls = "") {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}
function hydrateIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach(el => {
    if (el.tagName === "I") el.outerHTML = icon(el.dataset.icon);
    else { el.innerHTML = icon(el.dataset.icon); el.removeAttribute("data-icon"); }
  });
}

/* ============================================================
   Constants
   ============================================================ */
const SYS_MODES = [
  { id: "cool", v: 1, label: "Cool", icon: "snow" },
  { id: "heat", v: 2, label: "Heat", icon: "flame" },
  { id: "vent", v: 3, label: "Fan", icon: "fan" },
  { id: "dry",  v: 4, label: "Dry",  icon: "drop" },
  { id: "auto", v: 5, label: "Auto", icon: "auto" },
];
const FANS = [
  { id: "low", v: 1, label: "Low" }, { id: "medium", v: 2, label: "Med" }, { id: "high", v: 3, label: "High" },
  { id: "auto", v: 4, label: "Auto" }, { id: "top", v: 5, label: "Top" },
];
const ZONE_MODES = {
  1: { id: "open", label: "Open", color: "var(--open)" },
  2: { id: "close", label: "Closed", color: "var(--closed)" },
  3: { id: "auto", label: "Climate", color: "var(--climate)" },
  4: { id: "override", label: "Override", color: "var(--warn)" },
  5: { id: "constant", label: "Constant", color: "var(--accent)" },
};
const SLEEP = [[0, "Off"], [30, "30 min"], [60, "1 hour"], [120, "2 hours"], [240, "4 hours"], [360, "6 hours"], [480, "8 hours"], [720, "12 hours"]];
const DAYS = [["M", "Mon", "M"], ["Tu", "Tue", "T"], ["W", "Wed", "W"], ["Th", "Thu", "T"], ["F", "Fri", "F"], ["Sa", "Sat", "S"], ["Su", "Sun", "S"]];
const modeOf = v => SYS_MODES.find(m => m.v === v);
/* "Top" (5) is only offered for 4-speed or variable-speed fans (FanAutoType 3 / 2), or when it's
   already selected. A 2- or 3-speed fan has no speed above High. */
function fanChoices(current) {
  const t = state.system && state.system.FanAutoType;
  const topOk = t === 2 || t === 3 || current === 5;
  return FANS.filter(f => f.v !== 5 || topOk);
}

/* ============================================================
   State & API
   ============================================================ */
const state = { system: null, zones: null, schedules: null, settings: null, tab: "climate", lastOk: null, busy: 0, authed: false };
class AuthRequired extends Error {}
const pending = {}; // debounced setpoint changes

async function api(method, path, body) {
  progress(+1);
  try {
    const res = await fetch("/api/" + path, {
      method,
      headers: method === "POST" ? { "Content-Type": "application/json", "X-Izone-Web": "1" } : {},
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    let json;
    try { json = await res.json(); } catch { throw new Error(`Unexpected response (${res.status})`); }
    if (!json.ok) {
      if (json.auth === "login" || json.auth === "change") { showAuth(json.auth); throw new AuthRequired(json.error); }
      throw new Error(json.error || `Request failed (${res.status})`);
    }
    if (!path.startsWith("auth/")) setConn(true);
    return json.data;
  } catch (e) {
    if (e instanceof AuthRequired) throw e;
    if (e instanceof TypeError) { setConn(false); throw new Error("Can't reach the izone web server. Is it still running?"); }
    if (/connect to iZone controller/i.test(e.message)) setConn(false);
    throw e;
  } finally { progress(-1); }
}

function progress(d) {
  state.busy = Math.max(0, state.busy + d);
  document.getElementById("progress").classList.toggle("on", state.busy > 0);
  document.getElementById("refresh").classList.toggle("spin", state.busy > 0);
}
function setConn(ok) {
  if (!state.authed) return; // the sign-in screens show their own status
  if (ok) state.lastOk = Date.now();
  document.getElementById("conn-dot").className = "dot " + (ok ? "ok" : "bad");
  updateConnText(ok);
}
function updateConnText(ok = !!state.lastOk) {
  if (!state.authed) return;
  const el = document.getElementById("conn-text");
  if (!state.lastOk) { el.textContent = ok ? "Connected" : "Controller unreachable"; return; }
  const s = Math.round((Date.now() - state.lastOk) / 1000);
  el.textContent = document.getElementById("conn-dot").classList.contains("bad") ? "Controller unreachable"
    : s < 5 ? "Updated just now" : s < 60 ? `Updated ${s}s ago` : `Updated ${Math.round(s / 60)}m ago`;
}

/* ============================================================
   Helpers
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t1 = raw => (raw / 100).toFixed(1);
const hhmm = (h, m) => (h >= 0 && h <= 23 && m >= 0 && m <= 59) ? `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}` : null;
function toast(msg, ok = true) {
  const el = document.createElement("div");
  el.className = "toast " + (ok ? "ok" : "bad");
  el.innerHTML = icon(ok ? "check" : "alert") + `<div>${esc(msg)}</div>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, ok ? 2600 : 6500);
}
async function run(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { if (!(e instanceof AuthRequired)) { toast(e.message, false); render(); } return null; }
}
function seg(items, current, action, extra = "", cls = "") {
  return `<div class="seg ${cls}" role="group">${items.map(it =>
    `<button class="${it.cls || ""}" data-action="${action}" data-value="${esc(it.id)}" ${extra} aria-pressed="${it.id === current}">${it.icon ? icon(it.icon) : ""}${esc(it.label)}</button>`).join("")}</div>`;
}
/* Warnings: the server reports `WarningSteady`, which is only set when the controller reports
   the same warning consistently for ~30 s (some controllers flicker it while the wall shows nothing). */
function activeWarning() {
  const w = state.system && state.system.WarningSteady;
  return w && w !== "none" ? w : null;
}
const RESET_SENT = "Reset sent to the controller. If the warning comes back, the controller still thinks the filter is due; check the wall controller.";

function limits() {
  const s = state.system;
  if (s && s.EcoLock === 1) return [s.EcoMin / 100, s.EcoMax / 100];
  return [15, 30];
}

/* ============================================================
   Data loading
   ============================================================ */
async function loadClimate() {
  const [system, zones] = await Promise.all([api("GET", "system"), api("GET", "zones")]);
  state.system = system; state.zones = zones;
}
async function loadSchedules() {
  const [schedules] = await Promise.all([api("GET", "schedules"), state.zones ? null : loadClimate()]);
  state.schedules = schedules;
}
async function loadSettings() { state.settings = await api("GET", "settings"); }
async function refresh() {
  try {
    if (state.tab === "climate") await loadClimate();
    if (state.tab === "schedules") await loadSchedules();
    if (state.tab === "settings") { await loadSettings(); if (!state.system) state.system = await api("GET", "system"); }
  } catch (e) { if (e instanceof AuthRequired) return; toast(e.message, false); }
  render();
}

/* ============================================================
   Rendering
   ============================================================ */
function render() {
  if (state.tab === "climate") renderClimate();
  if (state.tab === "schedules") renderSchedules();
  if (state.tab === "settings") renderSettings();
}

function skeleton(h, n = 1) { return Array.from({ length: n }, () => `<div class="skeleton" style="height:${h}px"></div>`).join(""); }

function renderClimate() {
  const root = document.getElementById("view-climate");
  const s = state.system;
  if (!s || !state.zones) {
    root.innerHTML = skeleton(230) + `<div class="section-head"><h2>Zones</h2></div><div class="zones">${skeleton(190, 6)}</div>`;
    return;
  }
  const on = s.SysOn === 1;
  const mode = modeOf(s.SysMode) || SYS_MODES[0];
  const fan = (FANS.find(f => f.v === s.SysFan) || {}).id;
  const ctrlZone = s.CtrlZone < 14 ? state.zones.find(z => z.Index === s.CtrlZone) : null;
  const sp = pending.sys ?? s.Setpoint / 100;
  const [lo, hi] = limits();
  const acErr = (s.ACError || "").trim();
  const sleepOpt = SLEEP.some(([m]) => m === s.SleepTimer) ? s.SleepTimer : null;

  let banners = "";
  const warning = activeWarning();
  if (warning) banners += `<div class="banner warn">${icon("filter")}<span>${warning === "filter" ? "Filter needs cleaning" : "Warning: " + esc(warning)}</span>${warning === "filter" ? `<button class="btn sm" data-action="reset-filter">Mark as cleaned</button>` : ""}</div>`;
  if (acErr && acErr !== "OK") banners += `<div class="banner bad">${icon("alert")}<span>AC unit reports error <b>${esc(acErr)}</b></span></div>`;

  root.innerHTML = `${banners}
  <div class="card hero" style="--mode-c: var(--${mode.id})">
    <div class="power">
      <button class="power-btn ${on ? "on" : ""}" data-action="power" aria-pressed="${on}" aria-label="Turn air conditioning ${on ? "off" : "on"}">${icon("power")}</button>
      <div class="power-label">${on ? "On" : "Off"}<small>${on ? mode.label + " · " + (FANS.find(f => f.v === s.SysFan)?.label || "") + " fan" : "Tap to turn on"}</small></div>
    </div>
    <div class="temps">
      <div>
        <div class="kicker">Inside</div>
        <div class="temp-big">${(s.Temp / 100).toFixed(1)}<sup>°C</sup></div>
      </div>
      <div class="target-row">
        ${ctrlZone
          ? `<div><div class="kicker">Target</div><div class="follow-note">Follows <b>${esc(ctrlZone.Name)}</b> at <b>${t1(ctrlZone.Setpoint)}°C</b></div></div>`
          : `<div><div class="kicker" style="margin-bottom:6px">Target</div>
             <div class="stepper ${pending.sys !== undefined ? "pending" : ""}">
               <button data-action="sys-sp" data-delta="-0.5" aria-label="Lower" ${sp <= lo ? "disabled" : ""}>−</button>
               <div class="val">${sp.toFixed(1)}°</div>
               <button data-action="sys-sp" data-delta="0.5" aria-label="Raise" ${sp >= hi ? "disabled" : ""}>+</button>
             </div></div>`}
      </div>
    </div>
    <div class="controls">
      <div class="row"><div class="kicker">Mode</div>${seg(SYS_MODES.map(m => ({ ...m, cls: "mode-" + m.id })), mode.id, "sys-mode", "", "full")}</div>
      <div class="row"><div class="kicker">Fan</div>${seg(fanChoices(s.SysFan), fan, "sys-fan", "", "full")}</div>
      <div class="meta">
        <label class="chip" style="padding:3px 6px 3px 10px">${icon("moon")}Sleep
          <select data-action="sleep" style="padding:2px 6px;border-radius:8px;font-size:12.5px">
            ${sleepOpt === null ? `<option selected>${Math.floor(s.SleepTimer / 60)}h ${s.SleepTimer % 60}m left</option>` : ""}
            ${SLEEP.map(([m, l]) => `<option value="${m}" ${m === sleepOpt ? "selected" : ""}>${l}</option>`).join("")}
          </select></label>
        ${s.Supply ? `<span class="chip">${icon("wind")}Supply ${(s.Supply / 100).toFixed(1)}°</span>` : ""}
        ${s.EcoLock === 1 ? `<span class="chip">${icon("thermo")}Economy ${t1(s.EcoMin)}–${t1(s.EcoMax)}°</span>` : ""}
        <span class="chip ${acErr && acErr !== "OK" ? "bad" : "ok"}">${icon(acErr && acErr !== "OK" ? "alert" : "check")}${acErr && acErr !== "OK" ? "Error " + esc(acErr) : "System OK"}</span>
      </div>
    </div>
  </div>
  <div class="section-head"><h2>Zones</h2><span class="sub">${state.zones.filter(z => z.Mode !== 2).length} of ${state.zones.length} open</span></div>
  <div class="zones">${state.zones.map(zoneCard).join("")}</div>`;
}

function zoneCard(z) {
  const zm = ZONE_MODES[z.Mode] || { id: "?", label: "Mode " + z.Mode, color: "var(--muted)" };
  const hasSensor = z.SensType !== 255 && z.ZoneType !== 1;
  const climate = z.Mode === 3;
  const sp = pending["z" + z.Index] ?? z.Setpoint / 100;
  const [lo, hi] = limits();
  const alerts = [];
  if (z.SensorFault) alerts.push(`<span class="chip bad">${icon("alert")}Sensor fault</span>`);
  if (z.DmpFlt) alerts.push(`<span class="chip bad">${icon("alert")}Damper fault</span>`);
  if (z.BattVolt === 2) alerts.push(`<span class="chip warn">${icon("alert")}Battery empty</span>`);
  else if (z.BattVolt === 1 && z.SensType === 3) alerts.push(`<span class="chip warn">Battery half</span>`);
  const modes = z.ZoneType === 1
    ? [{ id: "open", label: "Open" }, { id: "close", label: "Close" }]
    : [{ id: "auto", label: "Climate" }, { id: "open", label: "Open" }, { id: "close", label: "Close" }];
  return `<div class="card zone ${z.Mode !== 2 ? "active" : ""}" style="--zc:${zm.color}">
    <div class="zone-top">
      <div style="min-width:0">
        <div class="zone-name"><span class="n">${esc(z.Name)}</span><span class="idx" title="Controller index">${z.Index}</span></div>
        <div class="zone-state">${zm.label}</div>
      </div>
      <button class="icon-btn" data-action="zone-more" data-zone="${z.Index}" aria-label="More options for ${esc(z.Name)}">${icon("more")}</button>
    </div>
    <div class="zone-mid">
      ${hasSensor ? `<div class="zone-temp">${(z.Temp / 100).toFixed(1)}<sup>°</sup></div>` : `<div class="zone-temp none">—</div>`}
      ${hasSensor ? `<div class="stepper small ${pending["z" + z.Index] !== undefined ? "pending" : ""}" title="${climate ? "Target temperature" : "Target (used in Climate mode)"}" style="${climate ? "" : "opacity:.6"}">
        <button data-action="zone-sp" data-zone="${z.Index}" data-delta="-0.5" aria-label="Lower ${esc(z.Name)} target" ${sp <= lo ? "disabled" : ""}>−</button>
        <div class="val">${sp.toFixed(1)}°</div>
        <button data-action="zone-sp" data-zone="${z.Index}" data-delta="0.5" aria-label="Raise ${esc(z.Name)} target" ${sp >= hi ? "disabled" : ""}>+</button>
      </div>` : ""}
    </div>
    ${seg(modes, zm.id, "zone-mode", `data-zone="${z.Index}"`, "small full")}
    ${alerts.length ? `<div class="alerts">${alerts.join("")}</div>` : ""}
  </div>`;
}

function schedTimes(s) {
  const a = hhmm(s.StartH, s.StartM), b = hhmm(s.StopH, s.StopM);
  return { start: a, stop: b, any: !!(a || b) };
}
function schedDays(s) { return DAYS.filter(([k]) => s.DaysEnabled && s.DaysEnabled[k] === 1).map(([, n]) => n); }

function renderSchedules() {
  const root = document.getElementById("view-schedules");
  if (!state.schedules) { root.innerHTML = `<div class="sched-list">${skeleton(76, 9)}</div>`; return; }
  root.innerHTML = `<div class="section-head" style="margin-top:4px"><h2>Schedules</h2><span class="sub">Turn the AC on or off automatically at set times</span></div>
  <div class="sched-list">${state.schedules.map(s => {
    const { start, stop, any } = schedTimes(s);
    const days = schedDays(s);
    const empty = !any && !days.length;
    const m = modeOf(s.Mode);
    const what = start && stop ? "On → off" : start ? "Turns on" : stop ? "Turns off" : "Not set up";
    return `<div class="card sched ${empty ? "empty" : ""}">
      <label class="switch" title="${s.Enabled ? "Enabled" : "Disabled"}"><input type="checkbox" data-action="sched-toggle" data-idx="${s.Index}" ${s.Enabled ? "checked" : ""} ${empty && !s.Enabled ? "disabled" : ""} aria-label="Enable schedule ${s.Index}"><span></span></label>
      <div style="min-width:0">
        <div class="sched-name"><span class="idx">${s.Index}</span>${s.Name ? `<span class="n">${esc(s.Name)}</span>` : `<span class="unnamed">Unnamed</span>`}</div>
        <div class="sched-sub">${what}${m && any ? ` · ${icon(m.icon)}${m.label}` : ""}</div>
      </div>
      <div class="times">${icon("clock")}${start ? start : `<span class="na">—</span>`}${icon("arrow")}${stop ? stop : `<span class="na">—</span>`}</div>
      <div class="days">${DAYS.map(([k, , short]) => `<span class="day ${s.DaysEnabled && s.DaysEnabled[k] === 1 ? "on" : ""}" title="${k}">${short}</span>`).join("")}</div>
      <div class="sched-actions">
        <button class="btn sm" data-action="sched-edit" data-idx="${s.Index}">${icon("edit")}Edit</button>
        <button class="icon-btn" data-action="sched-clear" data-idx="${s.Index}" aria-label="Clear schedule ${s.Index}" title="Clear" ${empty && !s.Name && !s.Enabled ? "disabled" : ""}>${icon("trash")}</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function renderSettings() {
  const root = document.getElementById("view-settings");
  if (!state.settings) { root.innerHTML = `<div class="settings">${skeleton(220, 3)}</div>`; return; }
  root.innerHTML = `<div class="section-head" style="margin-top:4px"><h2>Settings</h2><span class="sub">Installer-level options — change with care</span></div>
  <div class="settings">${state.settings.map(sec => `<div class="card set-section"><h3>${esc(sec.title)}</h3>${sec.items.map(settingRow).join("")}</div>`).join("")}</div>`;
}

function settingRow(it) {
  const k = it.kind;
  let ctl = "";
  if (k.type === "bool") {
    ctl = `<label class="switch"><input type="checkbox" data-action="set-bool" data-key="${it.key}" ${it.value === 1 ? "checked" : ""} aria-label="${esc(it.label)}"><span></span></label>`;
  } else if (k.type === "number") {
    const d = it.value === null ? "" : +(it.value / it.scale).toFixed(4);
    ctl = `<input type="number" data-key="${it.key}" data-orig="${d}" value="${d}" min="${k.min / it.scale}" max="${k.max / it.scale}" step="${k.step / it.scale}" aria-label="${esc(it.label)}">
      <span class="unit">${esc(it.unit)}</span>
      <button class="btn sm primary" data-action="set-number" data-key="${it.key}" hidden>Apply</button>`;
  } else if (k.type === "select") {
    ctl = `<select data-action="set-select" data-key="${it.key}" aria-label="${esc(it.label)}">${k.options.map(o => `<option value="${o.value}" ${o.value === it.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
  } else if (k.type === "action") {
    const active = it.value && it.value !== "none";
    ctl = `<span class="chip ${active ? "warn" : "ok"}">${active ? esc(it.value) : "No warning"}</span><button class="btn sm" data-action="set-action" data-key="${it.key}" ${active ? "" : "disabled"}>Reset</button>`;
  }
  return `<div class="set-row"><div class="lbl"><b>${esc(it.label)}</b>${it.help ? `<small>${esc(it.help)}</small>` : ""}</div><div class="set-ctl">${ctl}</div></div>`;
}

/* ============================================================
   Modals
   ============================================================ */
let modalEl = null;
function openModal(html, narrow = false) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "backdrop";
  modalEl.innerHTML = `<div class="modal ${narrow ? "narrow" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  modalEl.addEventListener("mousedown", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const f = modalEl.querySelector("input, select, button.primary");
  if (f) f.focus();
  return modalEl;
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
const modalHead = title => `<div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${icon("close")}</button></div>`;

function confirmDialog(title, text, okLabel, danger = true) {
  return new Promise(resolve => {
    const m = openModal(`${modalHead(esc(title))}<div class="modal-body"><div class="muted">${text}</div></div>
      <div class="modal-foot"><button class="btn" data-r="0">Cancel</button><button class="btn ${danger ? "danger solid" : "primary"}" data-r="1">${esc(okLabel)}</button></div>`, true);
    m.addEventListener("click", e => {
      const b = e.target.closest("[data-r],[data-action=modal-close]");
      if (!b) return;
      closeModal(); resolve(b.dataset.r === "1");
    });
    m.querySelector("[data-r='1']").focus();
  });
}

function zoneDialog(index) {
  const z = state.zones.find(z => z.Index === index);
  if (!z) return;
  const battery = ["Full", "Half", "Empty"][z.BattVolt] ?? "—";
  const rf = ["Full", "Half", "Quarter", "None"][z.RfSignal] ?? "—";
  const sensor = { 0: "CCTS", 1: "CSM", 2: "iSense", 3: "Wireless", 4: "Wired", 255: "None" }[z.SensType] ?? z.SensType;
  const m = openModal(`${modalHead(esc(z.Name) + ` <span class="idx">${z.Index}</span>`)}
    <div class="modal-body">
      <label class="field">Name<input type="text" id="zd-name" maxlength="15" value="${esc(z.Name)}"></label>
      <div class="field" style="display:grid;gap:6px"><span class="kicker">Mode</span>
        ${seg([3, 1, 2, 4, 5].map(v => ({ id: ZONE_MODES[v].id, label: ZONE_MODES[v].label })), (ZONE_MODES[z.Mode] || {}).id, "zd-mode", "", "small")}</div>
      <div style="display:grid;gap:10px"><span class="kicker">Airflow</span>
        <div class="range-row"><span class="muted">Minimum</span><input type="range" id="zd-min" min="0" max="100" step="5" value="${z.MinAir}"><b id="zd-min-v">${z.MinAir}%</b></div>
        <div class="range-row"><span class="muted">Maximum</span><input type="range" id="zd-max" min="0" max="100" step="5" value="${z.MaxAir}"><b id="zd-max-v">${z.MaxAir}%</b></div>
      </div>
      <div class="kv">
        <div><small>Sensor</small><b>${esc(sensor)}</b></div>
        <div><small>Signal</small><b>${rf}</b></div>
        <div><small>Battery</small><b>${battery}</b></div>
        <div><small>Calibration</small><b>${(z.Calibration / 10 >= 0 ? "+" : "") + (z.Calibration / 10).toFixed(1)}°</b></div>
        <div><small>Area</small><b>${z.Area} m²</b></div>
        <div><small>Status</small><b>${z.SensorFault || z.DmpFlt ? "Fault" : "OK"}</b></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" id="zd-save">Save</button></div>`);
  let mode = (ZONE_MODES[z.Mode] || {}).id;

  });
  ["min", "max"].forEach(k => m.querySelector("#zd-" + k).addEventListener("input", e => {
    m.querySelector(`#zd-${k}-v`).textContent = e.target.value + "%";
  }));
  m.querySelector("#zd-save").addEventListener("click", async () => {

    const min = +m.querySelector("#zd-min").value, max = +m.querySelector("#zd-max").value;

    if (mode !== (ZONE_MODES[z.Mode] || {}).id) body.mode = mode;
    if (min !== z.MinAir) body.min_air = min;
    if (max !== z.MaxAir) body.max_air = max;
    if (min > max) return toast("Minimum airflow can't be above maximum", false);
    if (!Object.keys(body).length) return closeModal();
    const btn = m.querySelector("#zd-save"); btn.disabled = true;
    const r = await run(() => api("POST", "zones/" + z.Index, body), `${name || z.Name} updated`);
    btn.disabled = false;

}

function scheduleDialog(index) {
  const s = state.schedules.find(s => s.Index === index);
  if (!s) return;
  const { start, stop } = schedTimes(s);
  const zones = (state.zones || []).map(z => ({ idx: z.Index, name: z.Name, cur: s.Zones?.[z.Index] }));
  const days = new Set(DAYS.filter(([k]) => s.DaysEnabled?.[k] === 1).map(([k]) => k));
  const zmOpts = v => [3, 1, 2, 4, 5].map(m => `<option value="${ZONE_MODES[m].id}" ${m === v ? "selected" : ""}>${ZONE_MODES[m].label}</option>`).join("");
  const m = openModal(`${modalHead(`Edit schedule <span class="idx">${s.Index}</span>`)}
    <div class="modal-body">
      <div class="grid2" style="align-items:end">
        <label class="field">Name<input type="text" id="sd-name" maxlength="15" value="${esc(s.Name)}" placeholder="e.g. Morning"></label>
        <label class="check" style="justify-self:end;padding-bottom:9px"><span>Enabled</span><span class="switch"><input type="checkbox" id="sd-enabled" ${s.Enabled ? "checked" : ""}><span></span></span></label>
      </div>
      <div class="grid2">
        <div class="field"><span>Turn on at</span><div class="time-field"><input type="time" id="sd-start" value="${start || "07:00"}" ${start ? "" : "disabled"}><label class="check"><input type="checkbox" id="sd-start-on" ${start ? "checked" : ""}>Set</label></div></div>
        <div class="field"><span>Turn off at</span><div class="time-field"><input type="time" id="sd-stop" value="${stop || "22:00"}" ${stop ? "" : "disabled"}><label class="check"><input type="checkbox" id="sd-stop-on" ${stop ? "checked" : ""}>Set</label></div></div>
      </div>
      <div class="field" style="display:grid;gap:8px"><span>Days</span>
        <div class="day-picker">${DAYS.map(([k, n, short]) => `<button type="button" class="day ${days.has(k) ? "on" : ""}" data-day="${k}" aria-pressed="${days.has(k)}" title="${n}">${short}</button>`).join("")}
          <div class="presets"><button type="button" class="btn sm ghost" data-preset="wk">Weekdays</button><button type="button" class="btn sm ghost" data-preset="we">Weekend</button><button type="button" class="btn sm ghost" data-preset="all">Every day</button></div>
        </div></div>
      <div class="grid2">
        <label class="field">AC mode<select id="sd-mode">${modeOf(s.Mode) ? "" : `<option value="" selected>Unchanged</option>`}${SYS_MODES.map(x => `<option value="${x.id}" ${x.v === s.Mode ? "selected" : ""}>${x.label}</option>`).join("")}</select></label>
        <label class="field">Fan<select id="sd-fan">${FANS.some(f => f.v === s.Fan) ? "" : `<option value="" selected>Unchanged</option>`}${fanChoices(s.Fan).map(x => `<option value="${x.id}" ${x.v === s.Fan ? "selected" : ""}>${x.label}</option>`).join("")}</select></label>
      </div>
      ${zones.length ? `<div class="field" style="display:grid;gap:8px"><span>Zones when this schedule runs</span>
        <div class="zone-table">${zones.map(z => `<div class="zr" data-zr="${z.idx}"><div class="zn"><span class="idx">${z.idx}</span>${esc(z.name)}</div>
          <select data-zmode aria-label="${esc(z.name)} mode">${zmOpts(z.cur?.Mode)}</select>
          <input type="number" data-zsp min="15" max="30" step="0.5" value="${z.cur ? (z.cur.Setpoint / 100).toFixed(1) : "23.0"}" aria-label="${esc(z.name)} setpoint"></div>`).join("")}</div></div>` : ""}
    </div>
    <div class="modal-foot"><button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" id="sd-save">Save schedule</button></div>`);

  const setDays = keys => m.querySelectorAll("[data-day]").forEach(b => { const on = keys.includes(b.dataset.day); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); on ? days.add(b.dataset.day) : days.delete(b.dataset.day); });
  m.addEventListener("click", e => {
    const d = e.target.closest("[data-day]");
    if (d) { const on = !days.has(d.dataset.day); on ? days.add(d.dataset.day) : days.delete(d.dataset.day); d.classList.toggle("on", on); d.setAttribute("aria-pressed", on); }
    const p = e.target.closest("[data-preset]");
    if (p) setDays({ wk: ["M", "Tu", "W", "Th", "F"], we: ["Sa", "Su"], all: DAYS.map(x => x[0]) }[p.dataset.preset]);
  });
  ["start", "stop"].forEach(k => m.querySelector(`#sd-${k}-on`).addEventListener("change", e => { m.querySelector("#sd-" + k).disabled = !e.target.checked; }));

  m.querySelector("#sd-save").addEventListener("click", async () => {
    const body = {};
    const name = m.querySelector("#sd-name").value.trim();
    if (name !== s.Name) { if (!name) return toast("Name can't be empty — use Clear to remove a schedule", false); body.name = name; }
    const ns = m.querySelector("#sd-start-on").checked ? m.querySelector("#sd-start").value : null;
    const ne = m.querySelector("#sd-stop-on").checked ? m.querySelector("#sd-stop").value : null;
    if ((m.querySelector("#sd-start-on").checked && !ns) || (m.querySelector("#sd-stop-on").checked && !ne)) return toast("Enter a time, or untick Set", false);
    if (ns !== start) body.start = ns;
    if (ne !== stop) body.stop = ne;
    const newDays = DAYS.filter(([k]) => days.has(k)).map(([, n]) => n);
    if (newDays.join() !== schedDays(s).join()) body.days = newDays;
    const mode = m.querySelector("#sd-mode").value; if (mode && mode !== modeOf(s.Mode)?.id) body.mode = mode;
    const fan = m.querySelector("#sd-fan").value; if (fan && fan !== FANS.find(f => f.v === s.Fan)?.id) body.fan = fan;
    const zchanges = [];
    for (const row of m.querySelectorAll("[data-zr]")) {
      const idx = +row.dataset.zr, cur = s.Zones?.[idx];
      const zm = row.querySelector("[data-zmode]").value, zsp = +row.querySelector("[data-zsp]").value;
      if (!(zsp >= 15 && zsp <= 30 && Math.round(zsp * 2) === zsp * 2)) return toast(`Zone ${idx}: setpoint must be 15–30 in 0.5° steps`, false);
      if (!cur || zm !== ZONE_MODES[cur.Mode]?.id || Math.round(zsp * 100) !== cur.Setpoint) zchanges.push({ index: idx, mode: zm, setpoint: zsp });
    }
    if (zchanges.length) body.zones = zchanges;
    const en = m.querySelector("#sd-enabled").checked;
    if (en !== (s.Enabled === 1)) body.enabled = en;
    if (en && !ns && !ne) return toast("Set a start or stop time before enabling", false);
    if (en && !newDays.length) return toast("Pick at least one day before enabling", false);
    if (!Object.keys(body).length) return closeModal();
    const btn = m.querySelector("#sd-save"); btn.disabled = true;
    const r = await run(() => api("POST", "schedules/" + s.Index, body), "Schedule saved");
    btn.disabled = false;
    if (r) { Object.assign(s, r); closeModal(); render(); }
  });
}

/* ============================================================
   Actions
   ============================================================ */
function debounceSetpoint(key, value, send) {
  pending[key] = value;
  render();
  clearTimeout(pending["t" + key]);
  pending["t" + key] = setTimeout(async () => {
    const v = pending[key];
    const r = await run(() => send(v));
    delete pending[key]; delete pending["t" + key];
    if (r) await refresh(); else render();
  }, 700);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-action]");
  if (!t || t.disabled) return;
  const a = t.dataset.action;
  const s = state.system;
  if (a === "modal-close") return closeModal();
  if (a === "change-password") return passwordDialog();
  if (a === "sign-out") {
    await run(() => api("POST", "auth/logout", {}));
    return showAuth("login", "You've been signed out.");
  }
  if (a === "power") {
    t.disabled = true;
    const r = await run(() => api("POST", "system", { power: s.SysOn !== 1 }), s.SysOn === 1 ? "AC turned off" : "AC turned on");
    if (r) { state.system = r; render(); }
    t.disabled = false;
  }
  if (a === "sys-mode" || a === "sys-fan") {
    const key = a === "sys-mode" ? "mode" : "fan";
    if (t.getAttribute("aria-pressed") === "true") return;
    const r = await run(() => api("POST", "system", { [key]: t.dataset.value }), `${key === "mode" ? "Mode" : "Fan"} set to ${t.textContent.trim()}`);
    if (r) { state.system = r; render(); }
  }
  if (a === "sys-sp") {
    const [lo, hi] = limits();
    const cur = pending.sys ?? s.Setpoint / 100;
    const v = Math.min(hi, Math.max(lo, cur + +t.dataset.delta));
    debounceSetpoint("sys", v, v => api("POST", "system", { setpoint: v }));
  }
  if (a === "zone-sp") {
    const idx = +t.dataset.zone, z = state.zones.find(z => z.Index === idx);
    const [lo, hi] = limits();
    const cur = pending["z" + idx] ?? z.Setpoint / 100;
    const v = Math.min(hi, Math.max(lo, cur + +t.dataset.delta));
    debounceSetpoint("z" + idx, v, v => api("POST", "zones/" + idx, { setpoint: v }));
  }
  if (a === "zone-mode") {
    if (t.getAttribute("aria-pressed") === "true") return;
    const idx = +t.dataset.zone, z = state.zones.find(z => z.Index === idx);
    const r = await run(() => api("POST", "zones/" + idx, { mode: t.dataset.value }), `${z.Name}: ${t.textContent.trim()}`);
    if (r) { Object.assign(z, r); render(); }
  }
  if (a === "zone-more") zoneDialog(+t.dataset.zone);
  if (a === "reset-filter") {
    t.disabled = true;
    const r = await run(() => api("POST", "settings", { key: "ResetWarning", value: "filter" }), RESET_SENT);
    if (r) { s.WarningSteady = "none"; state.settings = r; render(); }
    t.disabled = false;
  }
  if (a === "sched-edit") scheduleDialog(+t.dataset.idx);
  if (a === "sched-clear") {
    const sc = state.schedules.find(x => x.Index === +t.dataset.idx);
    const ok = await confirmDialog("Clear schedule?", `This disables <b>${esc(sc.Name || "schedule " + sc.Index)}</b> and removes its name, times and days. Zone and AC settings are kept.`, "Clear schedule");
    if (!ok) return;
    const r = await run(() => api("POST", `schedules/${sc.Index}/clear`, {}), "Schedule cleared");
    if (r) { Object.assign(sc, r); render(); }
  }
  if (a === "set-action") {
    t.disabled = true;
    const r = await run(() => api("POST", "settings", { key: t.dataset.key, value: null }), RESET_SENT);
    if (r) { if (state.system) state.system.WarningSteady = "none"; state.settings = r; render(); }
  }
  if (a === "set-number") {
    const input = t.parentElement.querySelector("input[type=number]");
    const it = findSetting(t.dataset.key);
    const raw = Math.round(+input.value * it.scale);
    const r = await run(() => api("POST", "settings", { key: it.key, value: raw }), `${it.label} updated`);
    if (r) { state.settings = r; render(); }
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  const a = t.dataset.action;
  if (a === "sleep") {
    const v = +t.value;
    if (Number.isNaN(v)) return;
    const r = await run(() => api("POST", "system", { sleep_timer: v }), v ? `Sleep timer set to ${SLEEP.find(x => x[0] === v)[1]}` : "Sleep timer off");
    if (r) { state.system = r; render(); }
  }
  if (a === "sched-toggle") {
    const idx = +t.dataset.idx, sc = state.schedules.find(x => x.Index === idx);
    t.disabled = true;
    const r = await run(() => api("POST", "schedules/" + idx, { enabled: t.checked }), `${sc.Name || "Schedule " + idx} ${t.checked ? "enabled" : "disabled"}`);
    if (r) Object.assign(sc, r);
    render();
  }
  if (a === "set-bool" || a === "set-select") {
    const it = findSetting(t.dataset.key);
    const value = a === "set-bool" ? (t.checked ? 1 : 0) : +t.value;
    const r = await run(() => api("POST", "settings", { key: it.key, value }), `${it.label} updated`);
    if (r) { state.settings = r; render(); }
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches(".set-ctl input[type=number]")) {
    const btn = t.parentElement.querySelector("[data-action=set-number]");
    btn.hidden = String(t.value) === t.dataset.orig;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modalEl) closeModal();
  if (e.key === "Enter" && e.target.matches(".set-ctl input[type=number]")) e.target.parentElement.querySelector("[data-action=set-number]").click();
});

function findSetting(key) {
  for (const sec of state.settings || []) for (const it of sec.items) if (it.key === key) return it;
  return null;
}

/* ============================================================
   Tabs, polling, start
   ============================================================ */
function showTab(tab) {
  state.authed = true;
  document.body.classList.remove("signed-out");
  document.getElementById("view-auth").hidden = true;
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-" + tab; });
  history.replaceState(null, "", "#" + tab);
  render();
  refresh();
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
document.getElementById("refresh").addEventListener("click", () => refresh());

/* Theme button: System -> Light -> Dark (saved in this browser) */
const THEMES = { system: ["monitor", "System"], light: ["sun", "Light"], dark: ["moon", "Dark"] };
function currentTheme() { return document.documentElement.dataset.theme || "system"; }
function paintThemeButton() {
  const [ic, label] = THEMES[currentTheme()];
  const b = document.getElementById("theme");
  b.innerHTML = icon(ic);
  b.title = `Theme: ${label} (click to change)`;
  b.setAttribute("aria-label", `Theme: ${label}. Click to change.`);
}
document.getElementById("theme").addEventListener("click", () => {
  const next = { system: "light", light: "dark", dark: "system" }[currentTheme()];
  if (next === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = next;
  try { next === "system" ? localStorage.removeItem("izone-theme") : localStorage.setItem("izone-theme", next); } catch (e) {}
  paintThemeButton();
});
paintThemeButton();
window.addEventListener("hashchange", () => {
  const t = location.hash.slice(1);
  if (state.authed && ["climate", "schedules", "settings"].includes(t) && t !== state.tab) { closeModal(); showTab(t); }
});

}, 15000);
setInterval(() => updateConnText(), 5000);
document.addEventListener("visibilitychange", () => { if (state.authed && !document.hidden && !modalEl) refresh(); });

/* ============================================================
   Sign-in and password change
   ============================================================ */
const requestedTab = () => ["climate", "schedules", "settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "climate";

function showAuth(mode, notice = "") {
  state.authed = false;
  closeModal();
  Object.keys(pending).forEach(k => { clearTimeout(pending[k]); delete pending[k]; });
  document.body.classList.add("signed-out");
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-auth"; });
  document.getElementById("conn-dot").className = "dot";
  document.getElementById("conn-text").textContent = mode === "login" ? "Signed out" : "Password change required";
  const root = document.getElementById("view-auth");
  root.hidden = false;
  if (mode === "login") {
    root.innerHTML = `<div class="auth-wrap"><form class="card auth-card" id="login-form" autocomplete="on">
      <div class="brand-mark">${icon("snow")}</div>
      <div><h1>Sign in to iZone</h1></div>
      <p>${notice ? esc(notice) : "Enter your password to control your air conditioning."}</p>
      <input type="text" name="username" value="izone" autocomplete="username" hidden>
      <label class="field">Password<input type="password" id="login-pw" autocomplete="current-password" required maxlength="128"></label>
      <div class="form-error" id="login-err" role="alert"></div>
      <button class="btn primary" type="submit" id="login-btn">${icon("lock")}Sign in</button>
    </form></div>`;
    const form = root.querySelector("#login-form");
    form.querySelector("#login-pw").focus();
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const btn = form.querySelector("#login-btn"), err = form.querySelector("#login-err"), pw = form.querySelector("#login-pw");
      btn.disabled = true; err.textContent = "";
      try {
        const r = await api("POST", "auth/login", { password: pw.value });
        if (r.must_change) showAuth("change"); else showTab(requestedTab());
      } catch (ex) {
        err.innerHTML = icon("alert") + `<span>${esc(ex.message)}</span>`;
        pw.value = ""; pw.focus();
      } finally { btn.disabled = false; }
    });
  } else {
    root.innerHTML = `<div class="auth-wrap"><form class="card auth-card" id="change-form">
      <div class="brand-mark">${icon("key")}</div>
      <div><h1>Choose a new password</h1></div>
      <p>You signed in with the default password. Set your own to continue.</p>
      ${passwordFields()}
      <div class="form-error" id="change-err" role="alert"></div>
      <button class="btn primary" type="submit" id="change-btn">Save and continue</button>
      <button class="btn ghost" type="button" data-action="sign-out">Sign out</button>
    </form></div>`;
    const form = root.querySelector("#change-form");
    form.querySelector("#pw-current").focus();
    form.addEventListener("submit", async e => {
      e.preventDefault();
      if (await submitPasswordChange(form, form.querySelector("#change-err"), form.querySelector("#change-btn"))) {
        toast("Password changed");
        showTab(requestedTab());
      }
    });
  }
}

function passwordFields() {
  return `<input type="text" name="username" value="izone" autocomplete="username" hidden>
    <label class="field">Current password<input type="password" id="pw-current" autocomplete="current-password" required maxlength="128"></label>
    <label class="field">New password<input type="password" id="pw-new" autocomplete="new-password" required minlength="10" maxlength="128"></label>
    <label class="field">Repeat new password<input type="password" id="pw-repeat" autocomplete="new-password" required maxlength="128"></label>
    <div class="hint">At least 10 characters. Changing it signs out other devices.</div>`;
}

async function submitPasswordChange(root, errEl, btn) {
  const cur = root.querySelector("#pw-current").value, nw = root.querySelector("#pw-new").value, rep = root.querySelector("#pw-repeat").value;
  const fail = m => { errEl.innerHTML = icon("alert") + `<span>${esc(m)}</span>`; return false; };
  errEl.textContent = "";
  if ([...nw].length < 10) return fail("The new password must be at least 10 characters.");
  if (nw !== rep) return fail("The new passwords don't match.");
  if (nw === cur) return fail("The new password must be different from the current one.");
  btn.disabled = true;
  try { await api("POST", "auth/password", { current: cur, new: nw }); return true; }
  catch (e) { return e instanceof AuthRequired ? false : fail(e.message); }
  finally { btn.disabled = false; }
}

function passwordDialog() {
  const m = openModal(`${modalHead("Change password")}
    <form id="pw-dialog"><div class="modal-body">${passwordFields()}<div class="form-error" id="pwd-err" role="alert"></div></div>
    <div class="modal-foot"><button class="btn" type="button" data-action="modal-close">Cancel</button><button class="btn primary" type="submit" id="pwd-btn">Change password</button></div></form>`, true);
  const form = m.querySelector("#pw-dialog");
  form.querySelector("#pw-current").focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (await submitPasswordChange(form, form.querySelector("#pwd-err"), form.querySelector("#pwd-btn"))) {
      closeModal(); toast("Password changed. Other devices were signed out.");
    }
  });
}

async function boot() {
  hydrateIcons();
  try {
    const s = await api("GET", "auth/status");
    if (!s.authenticated) return showAuth("login");
    if (s.must_change) return showAuth("change");
    showTab(requestedTab());
  } catch (e) {
    if (e instanceof AuthRequired) return;
    document.getElementById("view-auth").hidden = false;
    document.getElementById("view-auth").innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
  }
}
boot();
</script>
</body>
</html>
