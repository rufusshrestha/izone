# izone/Cargo.toml
[package]
name = "izone"
version = "1.1.5"
edition = "2024"
authors = ["Rufus Shrestha"]
license = "MIT"
description = "Command-line interface for controlling Airstream iZone air conditioning systems"
repository = "https://github.com/yourusername/izone"
keywords = ["izone", "hvac", "aircon", "cli", "home-automation"]
categories = ["command-line-utilities"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5.0"
colored = "2"
clap = { version = "4", features = ["derive"] }
lazy_static = "1.4"
stringcase = "0.4.0"
tiny_http = "0.12"
argon2 = "0.5"
aes-gcm = "0.10"
rpassword = "7"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
